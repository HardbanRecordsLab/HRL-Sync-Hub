# HRL Sync — API + MinIO (+ optional bundled Postgres)
#
#   cp .env.example .env
#
#   Local / self-contained (bundled Postgres):
#     docker compose --profile localdb up -d --build
#
#   Shared-Postgres deploy: set DATABASE_URL in .env to your existing server and
#   attach the api container to that DB's network via docker-compose.override.yml
#   (see docs/DEPLOYMENT.md), then:
#     docker compose up -d --build
#
#   docker compose exec api npm run db:seed   # create the admin user
#
# The frontend deploys separately (Vercel). Postgres and MinIO are never
# published to the host.

services:
  # Bundled Postgres — only starts with `--profile localdb`.
  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrlsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrlsync_dev}
      POSTGRES_DB: hrlsync
    volumes:
      - hrl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrlsync -d hrlsync"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - hrl_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - "9000"
    # ports:
    #   - "127.0.0.1:9001:9001"   # MinIO console during setup

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_SSL: "false"
      # Bundled db by default; override in .env for a shared Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgres://hrlsync:${POSTGRES_PASSWORD:-hrlsync_dev}@db:5432/hrlsync}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - hrl_staging:/app/uploads
      - hrl_logs:/app/logs

volumes:
  hrl_pgdata:
  hrl_minio:
  hrl_staging:
  hrl_logs:
