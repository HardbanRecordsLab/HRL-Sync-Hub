# HRL Sync — API + PostgreSQL + MinIO (library audio store)
#
#   cp .env.example .env          # fill JWT_SECRET, ADMIN_*, S3_*, Google keys
#   docker compose up -d --build
#   docker compose exec api npm run db:seed   # create the admin user
#
# The frontend deploys separately (Vercel) with VITE_API_URL pointing at this API.
# Postgres and MinIO are internal only — never published to the host.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrlsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrlsync_dev}
      POSTGRES_DB: hrlsync
    volumes:
      - hrl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrlsync -d hrlsync"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - hrl_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - "9000"
    # Uncomment to open the MinIO web console on the host during setup:
    # ports:
    #   - "127.0.0.1:9001:9001"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - ./.env
    environment:
      # docker-internal overrides — win over .env
      NODE_ENV: production
      PORT: 3001
      DB_SSL: "false"
      DATABASE_URL: postgres://hrlsync:${POSTGRES_PASSWORD:-hrlsync_dev}@db:5432/hrlsync
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - hrl_staging:/app/uploads

volumes:
  hrl_pgdata:
  hrl_minio:
  hrl_staging:
