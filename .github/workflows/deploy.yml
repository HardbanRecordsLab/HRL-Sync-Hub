name: Deploy HRL Sync API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install ffmpeg (watermarked previews)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            git pull --ff-only origin main
            docker compose up -d --build
            # docker compose 2.24 sometimes recreates the api container with only ONE of its two
            # networks (2026-10-12: once no route to MinIO, once none to Postgres). Re-attach any
            # missing one: the compose default network and, on this host, the shared DB network.
            API=$(docker compose ps -q api)
            NETS="$(basename "$PWD" | tr -cd 'a-z0-9_-')_default"
            if grep -qs hbrl-db docker-compose.override.yml; then NETS="$NETS hbrl-db"; fi
            for NET in $NETS; do
              if ! docker inspect "$API" --format '{{json .NetworkSettings.Networks}}' | grep -q "\"$NET\""; then
                echo "api container is missing $NET — reconnecting"
                docker network connect --alias api "$NET" "$API"
              fi
            done
            echo "Waiting for API to report healthy..."
            # 2026-09-22: a recreate-only-one-container deploy occasionally hits a slow
            # DNS resolution window for the sibling minio container (~70s of retries,
            # non-fatal — the app logs it and starts anyway) before the app starts
            # listening at all. 75s was too tight and failed a deploy that was actually
            # fine 15s later; give it real headroom instead of guessing again.
            ok=0
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "http://localhost:${API_PORT:-9110}/health"; then ok=1; break; fi
              sleep 3
            done
            docker compose ps
            if [ "$ok" = "1" ]; then
              echo "API healthy ✓"
            else
              echo "::error::API did not report healthy within 180s"
              docker compose logs api --tail 40
              exit 1
            fi
